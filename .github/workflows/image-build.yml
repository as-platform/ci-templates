name: image-build

on:
  workflow_call:
    inputs:
      name:
        description: Image name, becomes <registry>/<namespace>/<name>
        type: string
        required: true
      registry:
        description: Zot host without scheme
        type: string
        required: true
      namespace:
        type: string
        default: apps
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      target:
        type: string
        default: ""
      build-args:
        description: KEY=VALUE, one per line
        type: string
        default: ""
      tags:
        description: Explicit tags, space separated; the first is the primary one. Default is sha-<7 chars>
        type: string
        default: ""
      extra-tags:
        description: Additional tags, space separated
        type: string
        default: ""
      smoke:
        description: Shell command run inside the built image (needs bash in the image)
        type: string
        default: ""
      push:
        description: Push, sign and attest (false = build and scan only)
        type: boolean
        default: false
      fail-on-vulns:
        type: boolean
        default: true
      runner:
        description: JSON array of runs-on labels
        type: string
        default: '["self-hosted","homelab"]'
    secrets:
      ZOT_USER:
        required: false
      ZOT_PASSWORD:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
    outputs:
      tag:
        description: Primary tag (first of tags, default sha-<7 chars>)
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: Pushed manifest digest (empty when push=false)
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: repository@digest (empty when push=false)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
    env:
      REGISTRY: ${{ inputs.registry }}
      NAME: ${{ inputs.name }}
      NAMESPACE: ${{ inputs.namespace }}
      CONTEXT: ${{ inputs.context }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      TARGET: ${{ inputs.target }}
      BUILD_ARGS: ${{ inputs.build-args }}
      TAGS_INPUT: ${{ inputs.tags }}
      EXTRA_TAGS: ${{ inputs.extra-tags }}
      SMOKE: ${{ inputs.smoke }}
      ZOT_USER: ${{ secrets.ZOT_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute refs
        id: refs
        run: |
          if [ -n "${TAGS_INPUT// /}" ]; then
            read -r tag _ <<< "$TAGS_INPUT"
            tags="$TAGS_INPUT $EXTRA_TAGS"
          else
            tag="sha-${GITHUB_SHA::7}"
            tags="$tag $EXTRA_TAGS"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$tags $GITHUB_REF_NAME"; fi
          {
            echo "REPO=${REGISTRY}/${NAMESPACE}/${NAME}"
            echo "TAG=${tag}"
            echo "TAGS=${tags}"
            echo "ARCHIVE=${RUNNER_TEMP}/image.tar"
            echo "SBOM=${RUNNER_TEMP}/sbom.spdx.json"
          } >> "$GITHUB_ENV"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Registry login
        if: env.ZOT_USER != ''
        uses: as-platform/ci-templates/actions/zot-login@main
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then args+=(--build-arg "$line"); fi
          done <<< "$BUILD_ARGS"
          buildah build --format oci --layers "${args[@]}" \
            --file "${CONTEXT}/${DOCKERFILE}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${REPO}:${TAG}" \
            "$CONTEXT"

      - name: Smoke test
        if: inputs.smoke != ''
        run: |
          ctr=$(buildah from "${REPO}:${TAG}")
          buildah run "$ctr" -- bash -c "$SMOKE"
          buildah rm "$ctr"

      - name: Export archive
        run: buildah push "${REPO}:${TAG}" "oci-archive:${ARCHIVE}"

      - name: Trivy
        env:
          FAIL: ${{ inputs.fail-on-vulns }}
        run: |
          code=0
          if [ "$FAIL" = true ]; then code=1; fi
          trivy image --input "$ARCHIVE" --severity HIGH,CRITICAL --ignore-unfixed --exit-code "$code"

      - name: SBOM
        run: syft scan "oci-archive:${ARCHIVE}" -o "spdx-json=${SBOM}"

      - name: Push
        id: push
        if: inputs.push
        run: |
          buildah push --digestfile "${RUNNER_TEMP}/digest" "${REPO}:${TAG}" "docker://${REPO}:${TAG}"
          for t in $TAGS; do
            if [ "$t" != "$TAG" ]; then
              buildah tag "${REPO}:${TAG}" "${REPO}:${t}"
              buildah push "${REPO}:${t}" "docker://${REPO}:${t}"
            fi
          done
          digest=$(cat "${RUNNER_TEMP}/digest")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        if: inputs.push
        uses: as-platform/ci-templates/actions/cosign-sign@main
        with:
          ref: ${{ steps.push.outputs.image }}
          key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_PASSWORD }}
          sbom: ${{ runner.temp }}/sbom.spdx.json
