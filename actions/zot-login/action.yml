name: zot-login
description: Log buildah and cosign in to the Zot registry

inputs:
  registry:
    description: Registry host without scheme
    required: true
  username:
    required: true
  password:
    required: true

runs:
  using: composite
  steps:
    - name: buildah login
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        ZOT_USER: ${{ inputs.username }}
        ZOT_PASSWORD: ${{ inputs.password }}
      run: |
        printf '%s' "$ZOT_PASSWORD" | buildah login --username "$ZOT_USER" --password-stdin "$REGISTRY"
        mkdir -p "$HOME/.docker"
        printf '%s' "$ZOT_PASSWORD" | buildah login --authfile "$HOME/.docker/config.json" --username "$ZOT_USER" --password-stdin "$REGISTRY"
